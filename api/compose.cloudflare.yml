name: foodstuff-cloudflare

# Somente o tunel. A API e o MySQL continuam no Compose original.
services:
  tunnel:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: tunnel --no-autoupdate --protocol http2 --url http://app:5000
    restart: "no"
    networks:
      - foodstuff
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  foodstuff:
    external: true
    name: api_default
