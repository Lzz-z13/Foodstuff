# Docker Compose -> Container Orchestrator

services: # Containers
  app:
    restart: unless-stopped
    build: .
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SECRET: ${SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS}
      SKIP_VALIDATORS: ${SKIP_VALIDATORS}
    ports:
      - "5000:5000" # Host : Container
    volumes:
      - .:/usr/app 
      - /usr/app/node_modules
    
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: mysql:8.0 # Docker hub (v8 most compatible)
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-database:/docker-entrypoint-initdb.d # Automatic startup execution (internal folder)

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data: